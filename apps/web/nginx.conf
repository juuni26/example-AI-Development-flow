server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router owns the URL space below /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets (Vite produces content-hashed filenames)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry HTML
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
