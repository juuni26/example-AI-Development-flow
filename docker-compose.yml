services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleandrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleandrop}
      POSTGRES_DB: ${POSTGRES_DB:-cleandrop}
    volumes:
      - cleandrop_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleandrop} -d ${POSTGRES_DB:-cleandrop}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cleandrop}:${POSTGRES_PASSWORD:-cleandrop}@db:5432/${POSTGRES_DB:-cleandrop}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cleandrop}:${POSTGRES_PASSWORD:-cleandrop}@db:5432/${POSTGRES_DB:-cleandrop}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-cleandrop}:${POSTGRES_PASSWORD:-cleandrop}@db:5432/${POSTGRES_DB:-cleandrop}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-dev-secret-not-for-real-use}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cleandrop_pgdata:
